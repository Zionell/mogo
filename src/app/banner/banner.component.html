<section class="bg-gray-100 py-14">
    <div
        class="container mx-auto flex flex-wrap items-center justify-center gap-x-16 gap-y-10 lg:justify-between"
    >
        @for (logo of logos; track logo.img) {
            <img
                [ngSrc]="logo.img"
                [alt]="logo.alt"
                [width]="logo.width"
                [height]="logo.height"
                class="mix-blend-multiply"
            />
        }
    </div>
</section>
