<header
    class="container mx-auto w-full flex flex-col gap-4 sm:flex-row items-center z-20 justify-between"
>
    <div class="text-3xl font-bold select-none">{{ logo }}</div>

    <nav
        class="flex flex-wrap items-center justify-center gap-5 lg:gap-12 uppercase"
    >
        @for (menu of menuItems; track menu.value) {
            <button
                class="text-sm hover:text-[#fce38a] duration-300"
                (click)="handleClick(menu.value)"
            >
                {{ menu.label }}
            </button>
        }
    </nav>
</header>
