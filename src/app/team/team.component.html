<wrapper-section [id]="id">
    <title-section
        [title]="title"
        [supTitle]="supTitle"
        [description]="description"
    />

    <div id="contact" class="grid grid-cols-3 gap-8">
        <div class="cart" *ngFor="let card of teamCards">
            <div class="cart_item">
                <div class="cart_img">
                    <img
                        [ngSrc]="card.img"
                        [alt]="card.name"
                        width="380"
                        height="470"
                        class="w-full h-[30rem]"
                    />
                </div>
                <!--                <div class="item__text team__social">-->
                <!--                    <a *ngFor="let social of card.socials" [href]="social.link"><i [class]="social.icon"></i></a>-->
                <!--                </div>-->
            </div>
            <div class="text-center">
                <h3 class="text-sm uppercase mt-8 mb-3.5">{{ card.name }}</h3>
                <div class="roboto text-sm text-gray-400 font-light">
                    {{ card.role }}
                </div>
            </div>
        </div>
    </div>
</wrapper-section>
