<div class="bg-teal-200">
    <div class="container mx-auto grid grid-cols-2 md:grid-cols-5 md:h-72">
        @for (item of items; track item.value) {
            <div
                class="flex flex-col items-center gap-4 md:gap-7 text-5xl md:text-7xl font-bold border-x border-white justify-center w-full py-8 md:py-0 md:h-full"
            >
                {{ item.value }}
                <span class="uppercase text-sm text-center">{{ item.label }}</span>
            </div>
        }
    </div>
</div>
