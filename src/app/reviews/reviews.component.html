<div class="bg-gray-100 text-black py-16 md:py-28">
    <div class="container mx-auto relative flex items-center md:px-28">
        <button
            (click)="slidePrev()"
            class="absolute left-6 z-10 text-gray-400 text-3xl hover:text-red-400 duration-300 hidden md:block"
            aria-label="Previous review"
        >
            <i class="fas fa-chevron-left"></i>
        </button>

        <swiper-container
            #swiperEl
            slides-per-view="1"
            loop="true"
            class="w-full max-w-4xl mx-auto"
        >
            <swiper-slide *ngFor="let review of slides">
                <div
                    class="flex flex-col sm:flex-row gap-8 md:gap-12 items-center sm:items-start"
                >
                    <div
                        class="shrink-0 bg-teal-200 w-24 h-24 md:w-28 md:h-28 flex items-center justify-center"
                    >
                        <img
                            ngSrc="/images/SPEECH.png"
                            alt="Quote icon"
                            width="60"
                            height="60"
                        />
                    </div>

                    <div>
                        <p
                            class="roboto text-lg md:text-2xl font-light italic text-gray-400"
                        >
                            {{ review.quote }}
                        </p>
                        <div
                            class="kaushan text-xl mt-5 flex items-center gap-3"
                        >
                            <span
                                class="inline-flex bg-red-400 h-0.5 w-14"
                            ></span>
                            {{ review.author }}
                        </div>
                    </div>
                </div>
            </swiper-slide>
        </swiper-container>

        <button
            (click)="slideNext()"
            class="absolute right-6 z-10 text-gray-400 text-3xl hover:text-red-400 duration-300 hidden md:block"
            aria-label="Next review"
        >
            <i class="fas fa-chevron-right"></i>
        </button>
    </div>
</div>
