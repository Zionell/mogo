<section class="relative">
    <img
        class="absolute z-0 inset-0 w-full h-full object-cover"
        ngSrc="/images/bg/bg-devices.png"
        alt="Background image"
        fill
    />

    <div class="relative z-10 container text-black mx-auto pt-24">
        <title-section
            [title]="title"
            [supTitle]="supTitle"
        />

        <div class="relative w-fit mx-auto">
            <img
                ngSrc="/images/ipad.png"
                alt="iPad preview"
                class="w-full max-w-[30rem]"
                width="477"
                height="582"
            />
            <img
                ngSrc="/images/iphone.png"
                alt="iPhone preview"
                class="absolute w-64 -right-40 top-1/3 hidden lg:block"
                width="274"
                height="476"
            />
        </div>
    </div>
</section>
