<wrapper-section [id]="id">
    <title-section [title]="title" [supTitle]="supTitle" />

    <div
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-16 gap-y-10 lg:gap-y-24"
    >
        <ng-container *ngFor="let item of items">
            <div class="flex gap-7">
                <img
                    class="shrink-0 w-9 h-9"
                    [ngSrc]="item.imgSrc"
                    [alt]="item.title"
                    width="36"
                    height="36"
                />

                <div>
                    <h3 class="text-sm uppercase pb-5">{{ item.title }}</h3>
                    <div class="roboto text-sm text-gray-400">
                        {{ item.description }}
                    </div>
                </div>
            </div>
        </ng-container>
    </div>
</wrapper-section>
